<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:;"
    />
    <title>GapFlush Live Dashboard</title>

    <link href="./bootstrap.min.css" rel="stylesheet" />

    <style>
      body {
        background: #eef2f7;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        overflow: hidden;
      }

      /* New Black Header */
      /* --- Improved Black Header --- */
      .header {
        background: #111111;
        color: white;
        padding: 15px 25px; /* Added slightly more side padding for breathing room */
        border-radius: 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15); /* Slightly deeper shadow for depth */
      }

      .header-title {
        display: flex;
        align-items: center;
        gap: 18px; /* Perfectly spaces the logo and text without relying on margins */
        margin: 0;
        font-size: 1.6rem; /* Bumped up slightly for better hierarchy */
        font-weight: 700;
        letter-spacing: 0.5px;
      }

      .logo {
        height: 45px; /* Slightly larger presence */
        width: auto; /* Ensures it never stretches */
        object-fit: contain; /* Keeps the image inside its bounds perfectly */
        border-radius: 4px; /* Smooths the sharp corners of the black logo background */
      }

      .clock {
        font-size: 1.1rem;
        color: #e5e7eb; /* Slightly brighter text so it's easier to read */
        font-weight: 500;
        text-align: right;
        /* This prevents the entire header from slightly shifting when wide numbers (like 8) switch to narrow numbers (like 1) */
        font-variant-numeric: tabular-nums;
      }

      /* Table Scrolling Setup */
      .table-container {
        max-height: 65vh;
        overflow-y: auto;
        border-radius: 5px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        background: white;
      }
      /* Freeze the header row so it stays visible while scrolling */
      thead th {
        position: sticky;
        top: 0;
        background-color: #212529;
        color: white;
        z-index: 1;
      }

      .badge-success {
        background-color: #198754;
        color: white;
        padding: 5px 10px;
        border-radius: 5px;
        font-weight: bold;
      }
      .badge-danger {
        background-color: #dc3545;
        color: white;
        padding: 5px 10px;
        border-radius: 5px;
        font-weight: bold;
      }
      .badge-secondary {
        background-color: #6c757d;
        color: white;
        padding: 5px 10px;
        border-radius: 5px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="container-fluid px-4 mt-3">
      <div class="header shadow-sm">
        <div class="header-title">
          <img src="./tata-logo.jpeg" alt="Tata EV" class="logo" />
          GapFlush Live Engine
        </div>
        <div id="clock" class="clock"></div>
      </div>

      <div class="row mt-3 mb-3">
        <div class="col-md-4 offset-md-8">
          <input
            type="text"
            id="searchInput"
            class="form-control"
            placeholder="🔍 Search file by name..."
          />
        </div>
      </div>

      <div class="table-container">
        <table class="table table-hover table-bordered mb-0">
          <thead>
            <tr>
              <th>File Name</th>
              <th>Status</th>
              <th>Message</th>
              <th>Last Modified</th>
              <th>Processed Time</th>
              <th>Action</th>
              <th>Retry</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>

    <script src="./renderer.js"></script>
  </body>
</html>
